# Author: Raguram Kasthurisamy
# ---- Diagnostics -----------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_SHELL=y
CONFIG_ASSERT=y
CONFIG_HWINFO=y
CONFIG_REBOOT=y

# ---- Sensors: BME280 (upstream driver, I2C) and LIS2DH12 (project driver, SPI) ------------
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_RKS_LIS2DH12_TRIGGER=y

# ---- Inter-module messaging ---------------------------------------------------------------
CONFIG_ZBUS=y
CONFIG_ZBUS_CHANNEL_NAME=y

# ---- Bluetooth LE peripheral with LE Secure Connections ----------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="RKS Sensor Node"
CONFIG_BT_DEVICE_APPEARANCE=1344
CONFIG_BT_MAX_CONN=1
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_PAIR_ONLY=y
CONFIG_BT_SETTINGS=y
# Ask the phone for a 30-50 ms connection interval: responsive without draining power.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# ---- Persistent storage: bonds and the sampling interval --------------------------------
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# ---- Firmware updates over BLE (MCUmgr SMP) and image confirmation -----------------------
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y

# ---- Watchdog: per-thread task watchdog backed by the hardware WDT ------------------------
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y

# ---- Development kit LEDs ------------------------------------------------------------------
CONFIG_DK_LIBRARY=y

# ---- Stacks ------------------------------------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
