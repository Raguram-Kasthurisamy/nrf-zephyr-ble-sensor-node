# Author: Raguram Kasthurisamy
# Low-power build for current measurements:
#   west build -b <board> app --sysbuild -- -DEXTRA_CONF_FILE=overlay-low-power.conf
# The UART alone draws hundreds of microamps while its receiver is enabled, so the console,
# shell and logging go. Pair the phone with the normal build first: bonds are kept in flash.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SHELL=n
CONFIG_LOG=n
CONFIG_APP_SLOW_ADVERTISING=y
