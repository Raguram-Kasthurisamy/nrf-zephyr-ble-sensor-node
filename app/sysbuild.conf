# Author: Raguram Kasthurisamy
# MCUboot as the bootloader: images are signed, and an update is tried once and reverted
# unless the new firmware confirms itself after passing its self-test.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
# Your own signing key: create it with scripts/gen_signing_key.sh and pass it on the command
# line (see README). Without it, MCUboot's public development key is used, which is fine for
# trying things out and useless for security.
